<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Step Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="progress-container">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-steps">
      <div class="step-dot active" data-step="1">1</div>
      <div class="step-dot" data-step="2">2</div>
      <div class="step-dot" data-step="3">3</div>
      <div class="step-dot" data-step="4">4</div>
    </div>
  </div>

  <form id="multiStepForm">
    <div class="step active" data-step="1">
      <h2>Personal Information</h2>

      <label for="fullName">Full Name *</label>
      <input type="text" id="fullName" name="fullName">
      <span class="error" id="err-fullName"></span>

      <label for="email">Email *</label>
      <input type="email" id="email" name="email">
      <span class="error" id="err-email"></span>
    </div>
    <div class="step" data-step="2">
      <h2>Contact Details</h2>

      <label for="phone">Phone Number *</label>
      <input type="tel" id="phone" name="phone">
      <span class="error" id="err-phone"></span>

      <label for="address">Address *</label>
      <input type="text" id="address" name="address">
      <span class="error" id="err-address"></span>
    </div>
    <div class="step" data-step="3">
      <h2>Account Setup</h2>

      <label for="username">Username *</label>
      <input type="text" id="username" name="username">
      <span class="error" id="err-username"></span>

      <label for="password">Password *</label>
      <input type="password" id="password" name="password">
      <span class="error" id="err-password"></span>
    </div>
    <div class="step" data-step="4">
      <h2>Review & Submit</h2>
      <div class="summary" id="summaryBox"></div>
      <p class="submit-note" id="submitNote"></p>
    </div>

  </form>

  <div class="nav-buttons">
    <button type="button" id="prevBtn">← Previous</button>
    <button type="button" id="nextBtn">Next →</button>
    <button type="button" id="submitBtn" class="hidden">Submit ✓</button>
  </div>

  <p class="autosave-note" id="autosaveNote"></p>

</div>

<script src="script.js"></script>
</body>
</html>
